[project]
name = "shiaqa"
version = "0.1.0"
description = "Retrieval-augmented question answering over WikiShia, running fully locally on Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Reza Basseda" }]
keywords = ["rag", "ollama", "mediawiki", "wikishia", "question-answering", "sqlite-vec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "mwparserfromhell>=0.6.6",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
shiaqa = "shiaqa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiaqa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
